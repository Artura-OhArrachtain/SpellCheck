[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spellcheck-cli"
version = "1.0.0"
description = "Offline-capable spelling and grammar checker for the command line"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Spellcheck contributors" }]
keywords = ["spelling", "grammar", "checker", "cli", "nlp"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "pyspellchecker>=0.8,<1.0",
    "language-tool-python>=3.3,<4.0",
]

[project.scripts]
spellcheck = "spellcheck_cli:main"
spellcheck-server = "spellcheck_api:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["spellcheck_cli", "spellcheck_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
