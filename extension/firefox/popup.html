<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spellcheck</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>Spellcheck</h1>
    <label for="api-url">Spellcheck server</label>
    <input id="api-url" type="url" value="http://127.0.0.1:8000" spellcheck="false">
    <label for="text">Text to check</label>
    <textarea id="text" maxlength="500000" placeholder="Type or paste text…" autofocus></textarea>
    <label class="toggle"><input id="grammar" type="checkbox" checked> Check grammar and style</label>
    <button id="check" type="button">Check text</button>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="results" aria-live="polite"></section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
