name: Android app

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android assembleDebug

      - name: Print debug signing certificate SHA-256
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: spellcheck-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  publish-github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-debug
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/spellcheck-release.jks
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare release signing key
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_SIGNING_KEYSTORE_BASE64" >&2; exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_SIGNING_KEY_ALIAS" >&2; exit 1)
          test -n "$ANDROID_STORE_PASSWORD" || (echo "Missing ANDROID_SIGNING_STORE_PASSWORD" >&2; exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_SIGNING_KEY_PASSWORD" >&2; exit 1)
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"

      - name: Build signed release APK
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          VERSION_CODE="$GITHUB_RUN_NUMBER"
          gradle -p android \
            -PappVersionName="$VERSION_NAME" \
            -PappVersionCode="$VERSION_CODE" \
            assembleRelease

      - name: Prepare APK checksum and signing fingerprint
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Spellcheck-${GITHUB_REF_NAME}.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "dist/Spellcheck-${GITHUB_REF_NAME}.apk" \
            | tee "dist/Spellcheck-${GITHUB_REF_NAME}.certificate.txt"
          sha256sum "dist/Spellcheck-${GITHUB_REF_NAME}.apk" > "dist/Spellcheck-${GITHUB_REF_NAME}.apk.sha256"

      - name: Publish APK on GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Spellcheck ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
